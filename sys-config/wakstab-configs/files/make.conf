COMMON_NAME="Wakstab"
VVV="1.4.2"
COMMON_FLAGS="-march=znver5 -O2 -pipe"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=znver5"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
CPU_FLAGS_X86="aes avx avx2 avx512_bf16 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
FEATURES="binpkg-docompress binpkg-dostrip merge-sync multilib-strict sandbox sfperms xattr unmerge-orphans distlocks ebuild-locks fakeroot compress-build-logs fixlafiles parallel-install parallel-fetch buildpkg metadata-transfer binpkg-multi-instance "
LC_MESSAGES="C.UTF-8"
PKGDIR="/var/cache/binpkgs/${COMMON_NAME}/${VVV}"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-9 -T0"
PYTHON_TARGETS="python3_12 python3_13 python3_14"
RUBY_TARGETS="ruby33 ruby34 ruby40"
LUA_SINGLE_TARGET="lua5-4"
GUILE_SINGLE_TARGET="2-2"
RUST_SYSROOTS="bpf wasm "
USE="-valgrind  -audit -webengine -telepathy -xen multilib gstreamer rar uasm idn stunnel egl gles2 sndfile twolame wavpack kdesu amr ao id3tag lto pgo jit ladspa ibus kms libsamplerate pkcs11 bpf dvb ivorbis gbm aacs openexr duktape bdplus rocm java lua opencl caps appstream sdk modules python modules-compress pipewire sound-server bluetooth dbus mesa nvenc nvdec amf opengl openal vulkan dvd alsa acl cdr X wayland vdpau virgl v4l vaapi custom-cflags dist-kernel zstd "
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"
L10N="en en-US"
MAKEOPTS="-j28 -l30"
LINGUAS="en en_US"
INPUT_DEVICES="libinput evdev joystick"
VIDEO_CARDS="amdgpu radeonsi nvidia lavapipe virgl zink fbdev qxl vesa "
LLVM_TARGETS="X86 AMDGPU NVPTX DirectX RISCV SPIRV Xtensa BPF WebAssembly AArch64 ARM AVR M68k  "
QEMU_SOFTMMU_TARGETS="i386 x86_64 aarch64 arm riscv32 riscv64 avr m68k xtensa xtensaeb "
#QEMU_SOFTMMU_TARGETS="x86_64 i386 aarch64 riscv64 riscv32 xtensa xtensaeb avr"
QEMU_USER_TARGETS="i386 x86_64 aarch64 aarch64_be arm armeb riscv32 riscv64 m68k xtensa xtensaeb "
#QEMU_USER_TARGETS="x86_64 i386 aarch64 arm riscv64 riscv32"
GRUB_PLATFORMS="efi-64 pc"
LIBREOFFICE_EXTENSIONS="nlpsolver scripting-beanshell scripting-javascript wiki-publisher"

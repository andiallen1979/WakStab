[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wakstab-menu"
version = "1.2.0"
description = "Kconfig menuconfig TUI for managing Portage USE flags with single-entry per-package files"
requires-python = ">=3.10"
dependencies = ["kconfiglib"]

[project.scripts]
wakstab-menu = "wakstab_menu.cli:main"

[tool.setuptools.packages.find]
include = ["wakstab_menu*"]
